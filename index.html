<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
           <div><img src="assets/TE-logo.png" alt="Text Editor Logo" width="80px" height="80px"></div>
           <div><h2>text-editor</h2></div>
    </header>
    <main>
        <section class="intro">
            <h3>here you go with your text editor,</h3>
            <p>edit the text with text editor ,correct the grammer,change fonts/style .Do whatever you want in your own way</p>
        </section>
        <section class="editor">
            <div class="textarea">
                <label for="text"></label>
                <textarea id="text" rows="20" cols="80" placeholder="write your text here......"></textarea>
            </div>
            <div class="buttons">
                <button id="bold">BOLD</button>
                <button id="italic">ITALIC</button>
                <button id="underline">UNDERLINE</button>
                <button id="uppercase">UPPERCASE</button>   
                <button id="lowercase">LOWERCASE</button>
                <button id="capitalize">CAPITALIZE</button>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer">
            <p>made with ❤️ , to practice  html and css.</p>
        </div>
    </footer>
</body>
</html>
